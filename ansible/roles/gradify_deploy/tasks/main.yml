---
- name: Ensure target deployment directory exists
  file:
    path: "{{ deploy_dir }}"
    state: directory

- name: Copy K8s manifests from repository
  copy:
    src: "{{ playbook_dir }}/../k8s/"
    dest: "{{ deploy_dir }}/"

- name: Copy ELK manifests
  copy:
    src: "{{ playbook_dir }}/../k8s/elk/"
    dest: "{{ deploy_dir }}/elk/"

- name: Inject Git commit image tag for services rebuilt this run
  replace:
    path: "{{ deploy_dir }}/{{ item }}.yaml"
    regexp: 'image: key717/{{ item }}:latest\s*'
    replace: "image: key717/{{ item }}:{{ image_tag }}"
  loop: "{{ build_services }}"

# Only touch manifests for services actually rebuilt & pushed this run.
# Applying the untouched services' manifests too would overwrite their
# currently-running (working) image tag with this run's Git SHA, even though
# no image was ever built/pushed under that SHA for them -> ImagePullBackOff.
- name: Apply manifests for services rebuilt this run
  command: kubectl apply -f "{{ deploy_dir }}/{{ item }}.yaml" --validate=false
  loop: "{{ build_services }}"
  register: kubectl_output

- name: Apply shared manifests (ingress)
  command: kubectl apply -f "{{ deploy_dir }}/ingress.yaml" --validate=false

- name: Apply ELK manifests
  command: kubectl apply -R -f "{{ deploy_dir }}/elk/" --validate=false

- name: Force rollout for updated services
  shell: |
    IFS=',' read -ra ADDR <<< "{{ lookup('env', 'GRADIFY_BUILD_LIST') }}"
    for svc in "${ADDR[@]}"; do
      if [ -n "$svc" ]; then
        echo "Restarting deployment $svc..."
        kubectl rollout restart deployment/$svc || \
        echo "Deployment $svc not found, skipping restart."
      fi
    done
  ignore_errors: yes

- name: Show kubectl output
  debug:
    msg: "{{ item.stdout_lines }}"
  loop: "{{ kubectl_output.results }}"
  loop_control:
    label: "{{ item.item }}"

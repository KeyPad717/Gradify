---
- name: Wait for Kubernetes API to be responsive
  command: kubectl wait --for=condition=Ready nodes --all --timeout=120s
  register: api_wait
  until: api_wait.rc == 0
  retries: 10
  delay: 15

- name: Check Kubernetes cluster connectivity
  command: kubectl cluster-info
  register: cluster_info
  failed_when: false

- name: Show cluster info for debugging
  debug:
    var: cluster_info.stdout_lines

- name: Wait for CoreDNS to be ready
  command: >
    kubectl wait
    --for=condition=ready pod
    -n kube-system
    -l k8s-app=kube-dns
    --timeout=120s
  ignore_errors: yes

- name: Preload Ingress images
  command: "minikube image load {{ item }}"
  loop:
    - registry.k8s.io/ingress-nginx/controller:v1.10.1
    - registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.4.1
  ignore_errors: yes

- name: Enable Minikube Ingress addon
  command: minikube addons enable ingress
  changed_when: true

- name: Wait for Ingress controller to be ready
  command: >
    kubectl wait
    --namespace ingress-nginx
    --for=condition=ready pod
    --selector=app.kubernetes.io/component=controller
    --timeout=120s
  register: ingress_wait
  until: ingress_wait.rc == 0
  retries: 5
  delay: 10

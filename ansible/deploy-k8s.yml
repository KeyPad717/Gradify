---
- name: Deploy Gradify K8s Manifests
  hosts: localhost
  connection: local
  tasks:
    - name: Ensure target deployment directory exists
      file:
        path: /tmp/gradify-k8s-deploy
        state: directory

    - name: Copy K8s manifests from repository to target host directory
      copy:
        src: ../k8s/
        dest: /tmp/gradify-k8s-deploy/

    - name: Check if Minikube is installed
      command: which minikube
      register: minikube_check
      ignore_errors: yes
      changed_when: false

    - name: Download Minikube if not installed
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /tmp/minikube
        mode: '0755'
      when: minikube_check.rc != 0

    - name: Install Minikube
      command: install /tmp/minikube /usr/local/bin/minikube
      become: yes
      when: minikube_check.rc != 0

    - name: Ensure Minikube is running
      command: minikube start
      register: minikube_output
      changed_when: "'Done! kubectl is now configured' in minikube_output.stdout"

    - name: Run kubectl apply to deploy all configuration files
      command: kubectl apply -f /tmp/gradify-k8s-deploy/
      register: kubectl_output
      failed_when: kubectl_output.rc != 0

    - name: Show kubectl output
      debug:
        var: kubectl_output.stdout_lines

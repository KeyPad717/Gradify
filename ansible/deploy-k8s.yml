---
- name: Deploy Gradify K8s Manifests
  hosts: localhost
  connection: local
  tasks:
    - name: Ensure target deployment directory exists
      file:
        path: /tmp/gradify-k8s-deploy
        state: directory

    - name: Copy K8s manifests from repository to target host directory
      copy:
        src: ../k8s/
        dest: /tmp/gradify-k8s-deploy/

    - name: Check if Minikube is installed
      command: which minikube
      register: minikube_check
      ignore_errors: yes
      changed_when: false

    - name: Download Minikube if not installed
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /tmp/minikube
        mode: '0755'
      when: minikube_check.rc != 0

    - name: Install Minikube
      command: install /tmp/minikube /usr/local/bin/minikube
      become: yes
      when: minikube_check.rc != 0

    - name: Verify Docker daemon is running
      command: docker info
      register: docker_info
      failed_when: docker_info.rc != 0
      changed_when: false

    - name: Ensure Minikube is running with Docker driver
      command: minikube start --driver=docker --memory 4096 --cpus 2 --force --extra-config=kubelet.image-gc-high-threshold=95
      register: minikube_start_result
      ignore_errors: yes

    - name: Delete and recreate Minikube ONLY if cluster is corrupted
      block:
        - name: Delete corrupted Minikube cluster
          command: minikube delete
        - name: Start Minikube fresh
          command: minikube start --driver=docker --memory 4096 --cpus 2 --force --extra-config=kubelet.image-gc-high-threshold=95
      when: 
        - "minikube_start_result.rc != 0 and ('K8S_APISERVER_MISSING' in minikube_start_result.stderr or 'recreate' in minikube_start_result.stderr)"

    - name: Wait for Kubernetes API to be responsive
      command: kubectl wait --for=condition=Ready nodes --all --timeout=120s
      register: api_wait
      until: api_wait.rc == 0
      retries: 10
      delay: 15

    - name: Wait for CoreDNS to be ready (fixes external resolution)
      command: kubectl wait --for=condition=ready pod -n kube-system -l k8s-app=kube-dns --timeout=120s
      ignore_errors: yes

    - name: Preload Ingress images to bypass network timeouts
      command: "minikube image load {{ item }}"
      loop:
        - registry.k8s.io/ingress-nginx/controller:v1.10.1
        - registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.4.1
      ignore_errors: yes

    - name: Enable Minikube Ingress addon
      command: minikube addons enable ingress
      changed_when: true

    - name: Wait for Ingress controller to be ready
      command: kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s
      register: ingress_wait
      until: ingress_wait.rc == 0
      retries: 5
      delay: 10

    - name: Run kubectl apply to deploy all configuration files
      command: kubectl apply -R -f /tmp/gradify-k8s-deploy/
      register: kubectl_output
      failed_when: kubectl_output.rc != 0

    - name: Show kubectl output
      debug:
        var: kubectl_output.stdout_lines
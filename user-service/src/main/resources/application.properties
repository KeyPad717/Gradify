spring.application.name=auth-service
server.port=8081

# Database - configure via environment variables
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?user=${SUPABASE_DB_USER}&password=${SUPABASE_DB_PASSWORD}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Supabase - configure via environment variables
supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}